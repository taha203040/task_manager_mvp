name: Node.js CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        # Test against the latest LTS version of Node.js
        node-version: [18.x]

    steps:
    # Checkout the repository code
    - uses: actions/checkout@v4

    # Set up Node.js with the specified version and enable npm caching
    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'


